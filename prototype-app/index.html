<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decode — interactive prototype (HIG)</title>
  <link rel="stylesheet" href="hig.css" />
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, Inter, sans-serif; background: #e9e9ec; color: #1c1c1e; }
    #app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
    #sidebar { background: #fff; border-right: 1px solid #e3e3e6; padding: 18px 14px; overflow-y: auto; }
    .brand strong { font-size: 19px; } .brand span { display:block; font-size: 11px; color: #8a8a8e; margin-top:2px; }
    .sb-h { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #8a8a8e; margin: 18px 0 8px; font-weight: 600; }
    .sb-btn { display:block; width:100%; text-align:left; border:1px solid #e3e3e6; background:#fff; border-radius:9px;
      padding:8px 10px; font-size:12.5px; margin-bottom:4px; cursor:pointer; color:#1c1c1e; line-height:1.25; font-family:inherit; }
    .sb-btn small { display:block; color:#8a8a8e; font-size:11px; font-weight:400; }
    .sb-btn.flow { font-weight:600; } .sb-btn:hover { border-color:#1c1c1e; }
    .sb-btn.active, .sb-btn.current { background:#1c1c1e; color:#fff; } .sb-btn.active small { color:#cfcfd3; }
    #stage { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    #topbar { display:flex; align-items:center; gap:12px; padding:10px 18px; background:#fff; border-bottom:1px solid #e3e3e6; }
    #topbar .tt { flex:1; font-size:13px; color:#8a8a8e; }
    #topbar button { border:1px solid #e3e3e6; background:#fff; border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit; }
    #topbar button:disabled { opacity:.4; cursor:default; }
    #flowst { font-size:12px; color:#8a8a8e; min-width:120px; text-align:center; }
    #viewport { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; padding:28px; }
    #device { position:relative; width:402px; height:874px; flex:0 0 auto; background:#000; border-radius:54px; padding:11px;
      box-shadow:0 24px 70px rgba(0,0,0,.28); }
    #screen-root { position:absolute; inset:11px; border-radius:44px; overflow:hidden; background:#fff; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand"><strong>Decode</strong><span>interactive prototype · Apple HIG</span></div>
      <div class="sb-h">Flows</div>
      <div id="flow-list" data-testid="flow-list"></div>
      <div class="sb-h">Screens</div>
      <div id="screen-list" data-testid="screen-list"></div>
    </aside>
    <main id="stage">
      <div id="topbar">
        <button id="btn-back" data-testid="nav-back">←</button>
        <span class="tt" id="tt" data-testid="screen-id">—</span>
        <button id="btn-prev" data-testid="flow-prev" hidden>Prev</button>
        <span id="flowst" data-testid="flow-status" hidden></span>
        <button id="btn-next" data-testid="flow-next" hidden>Next</button>
        <button id="btn-exit" data-testid="flow-exit" hidden>✕ flow</button>
      </div>
      <div id="viewport">
        <div id="device">
          <div id="screen-root" data-testid="screen-root" data-screen=""></div>
        </div>
      </div>
    </main>
  </div>
  <script src="screens.js"></script>
  <script src="app.js"></script>
</body>
</html>
